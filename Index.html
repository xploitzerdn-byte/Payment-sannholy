<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sannholy Payment Gateway</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .payment-container {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        /* Header */
        .brand-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .brand-header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .brand-header p {
            font-size: 13px;
            opacity: 0.8;
        }

        /* Invoice Summary */
        .invoice-box {
            padding: 20px 25px;
            background: #f8fafc;
            border-bottom: 1px dashed #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .invoice-info h3 {
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
        }

        .invoice-info p {
            font-size: 12px;
            color: #94a3b8;
        }

        .price-tag {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
        }

        /* Payment Methods */
        .payment-body {
            padding: 25px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 15px;
        }

        .method-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .method-item {
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .method-item:hover {
            border-color: #a5b4fc;
            background: #f8fafc;
        }

        /* Radio Input Styling */
        .method-item input[type="radio"] {
            margin-right: 15px;
            accent-color: #667eea;
            width: 18px;
            height: 18px;
        }

        .method-details {
            flex-grow: 1;
        }

        .method-name {
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
        }

        .method-desc {
            font-size: 11px;
            color: #64748b;
            margin-top: 2px;
        }

        /* Checked State via CSS */
        .method-item:has(input[type="radio"]:checked) {
            border-color: #667eea;
            background-color: #f5f7ff;
        }

        /* Pay Button */
        .btn-pay {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-pay:hover {
            opacity: 0.9;
        }

        /* Footer */
        .payment-footer {
            text-align: center;
            padding: 15px;
            font-size: 11px;
            color: #94a3b8;
            background: #fafafa;
            border-top: 1px solid #f1f5f9;
        }
    </style>
</head>
<body>

    <div class="payment-container">
        <div class="brand-header">
            <h1>SANNHOLY</h1>
            <p>Secure Payment Gateway</p>
        </div>

        <div class="invoice-box">
            <div class="invoice-info">
                <h3>Tagihan #SH-99214</h3>
                <p>Order ID: Sannholy-Store</p>
            </div>
            <div class="price-tag">
                Rp 150.000
            </div>
        </div>

        <div class="payment-body">
            <div class="section-title">Pilih Metode Pembayaran</div>
            
            <form id="paymentForm" onsubmit="prosesPembayaran(event)">
                <div class="method-options">
                    
                    <label class="method-item">
                        <input type="radio" name="payment_method" value="BCA" checked>
                        <div class="method-details">
                            <div class="method-name">Transfer Bank BCA</div>
                            <div class="method-desc">Dicek otomatis, pengerjaan instan</div>
                        </div>
                    </label>

                    <label class="method-item">
                        <input type="radio" name="payment_method" value="Mandiri">
                        <div class="method-details">
                            <div class="method-name">Transfer Bank Mandiri</div>
                            <div class="method-desc">Dicek otomatis</div>
                        </div>
                    </label>

                    <label class="method-item">
                        <input type="radio" name="payment_method" value="QRIS">
                        <div class="method-details">
                            <div class="method-name">QRIS / E-Wallet</div>
                            <div class="method-desc">Gopay, OVO, Dana, ShopeePay</div>
                        </div>
                    </label>

                </div>

                <button type="submit" class="btn-pay">Bayar Sekarang</button>
            </form>
        </div>

        <div class="payment-footer">
            &copy; 2026 Sannholy. All Rights Reserved.
        </div>
    </div>

    <script>
        function prosesPembayaran(event) {
            event.preventDefault();
            const pilihan = document.querySelector('input[name="payment_method"]:checked').value;
            alert('Terima kasih! Mengalihkan ke halaman pembayaran ' + pilihan + ' Sannholy...');
        }
    </script>

</body>
          </html>
